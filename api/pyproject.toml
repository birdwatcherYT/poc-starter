[project]
name = "poc-starter-api"
version = "0.1.0"
description = "本番運用を見据えた FastAPI + PostgreSQL の PoC スターター"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=23.0",
  "python-dotenv>=1.0",
  "pydantic>=2.8",
  "poc-starter-database",
]

[tool.uv.sources]
poc-starter-database = { path = "../database" }

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "httpx>=0.27",
  "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C90", "B", "A"]
ignore = ["E501", "C901"]

[tool.ruff.lint.per-file-ignores]
"api.py" = ["E402"]
"scripts/generate_docs.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
