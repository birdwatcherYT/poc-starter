<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoC Starter</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>
  <body>
    <main class="container">
      <h1>PoC Starter</h1>
      <p>FastAPI + PostgreSQL の動作確認用ページ。</p>
      <form id="echo-form">
        <label>
          message
          <input id="message" type="text" required value="hello" />
        </label>
        <label>
          author (optional)
          <input id="author" type="text" value="web" />
        </label>
        <button type="submit">POST /example/echo</button>
      </form>
      <pre id="out">(送信するとレスポンスが表示されます)</pre>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
