<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoC Starter</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>
  <body>
    <main class="container">
      <h1>PoC Starter</h1>
      <p>FastAPI + PostgreSQL の動作確認用ページ。</p>

      <section>
        <h2>Messages</h2>
        <form id="message-form">
          <label>
            message
            <input id="message" type="text" required value="hello" />
          </label>
          <label>
            author (optional)
            <input id="author" type="text" value="web" />
          </label>
          <button type="submit">POST /messages</button>
        </form>
        <pre id="message-out">(送信するとレスポンスが表示されます)</pre>
      </section>

      <section>
        <h2>Documents</h2>
        <form id="document-form">
          <label>
            title
            <input id="doc-title" type="text" required value="猫の生態" />
          </label>
          <label>
            content
            <textarea id="doc-content" required>猫は哺乳類で、夜行性の傾向がある。</textarea>
          </label>
          <button type="submit">POST /documents</button>
        </form>
        <pre id="document-out">(送信するとレスポンスが表示されます)</pre>

        <form id="similar-form">
          <label>
            query
            <input id="similar-query" type="text" required value="猫" />
          </label>
          <button type="submit">GET /documents/similar</button>
        </form>
        <pre id="similar-out">(検索すると結果が表示されます)</pre>
      </section>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
