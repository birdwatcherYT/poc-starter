[project]
name = "poc-starter-database"
version = "0.1.0"
description = "DB スキーマ定義 (SQLAlchemy) + マイグレーション (Alembic)"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schema"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C90", "B", "A"]
ignore = ["E501", "C901"]
