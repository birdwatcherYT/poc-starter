# Cloud Build: migrate イメージを Artifact Registry にビルド & push する。
#
# キャッシュについて:
#   - 2 回目以降は AR のキャッシュを --cache-from に使い、差分レイヤだけ push する。
#   - BuildKit の inline cache (BUILDKIT_INLINE_CACHE=1) でキャッシュメタデータをイメージに埋め込む。
#   - マルチステージの builder は最終イメージにレイヤが残らないため、:builder-cache として別 push し、
#     それを --cache-from に与えないと uv sync が毎回再実行される。

substitutions:
  _REGION: asia-northeast1
  _AR_REPO: poc-starter
  _IMAGE: migrate
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - DOCKER_BUILDKIT=1

steps:
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:builder-cache" || true
        docker pull "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest" || true

  - id: build-builder
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=builder
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --file=migrate.Dockerfile
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:builder-cache
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:builder-cache
      - .

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --file=migrate.Dockerfile
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:builder-cache
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:builder-cache
