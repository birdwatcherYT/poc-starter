[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# 生成されるファイル名: 20260523_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s
timezone = Asia/Tokyo
# sqlalchemy.url は alembic/env.py で環境変数から動的に組み立てる。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
